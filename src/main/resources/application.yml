server:
  address: 127.0.0.1
  port: 8090

spring:
  application:
    name: kaaris-chatbot
  config:
    import:
      - classpath:excluded-categories.yml
      - classpath:company-info.yml

  # Credentials come only from the environment (read-only SQL login "kaaris_chatbot").
  datasource:
    url: ${CHATBOT_DB_URL}
    username: ${CHATBOT_DB_USER}
    password: ${CHATBOT_DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      pool-name: chatbot-db
      maximum-pool-size: 5
      read-only: true
      # Milliseconds: HikariConfig takes a plain long, so "5s" does not bind.
      connection-timeout: 5000

  jdbc:
    template:
      query-timeout: 10s

  # Gemini Developer API (API key), not Vertex AI. The key comes only from the environment.
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: ${CHATBOT_MODEL:gemini-3.5-flash}
          temperature: 0.2
    # ChatContext stops tools after 5 calls per turn and asks the model to answer; this is only a hard backstop
    # (the turn fails with ToolCallLimitExceededException) in case the model keeps calling anyway.
    tools:
      limits:
        max-total-tool-calls: 10
    # The default (10 attempts, x5 backoff) can hold a request for minutes on a rate limit.
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 2s
        multiplier: 2
        max-interval: 10s

  cache:
    type: caffeine
    cache-names: categories,apiFamilies
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m

kaaris:
  chat:
    # Per model HTTP call (a turn with tool calls makes several).
    model-timeout: 30s
    # Shared secret the website's server sends as X-Internal-Token. Empty = every chat request gets 401.
    internal-token: ${CHATBOT_INTERNAL_TOKEN:}
    # Chat memory: a session is forgotten after this long without messages.
    session-idle-timeout: 30m
    max-sessions: 10000
  geo:
    # Same service the website uses; the IP is appended, then ?fields=status,countryCode.
    lookup-url: http://ip-api.com/json/
    lookup-timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
