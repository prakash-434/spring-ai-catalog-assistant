# Chatbot evaluation set. Run with:  mvnw -Peval test   (resumes from target/eval/results-<model>.jsonl)
#
# Every expected value below was read from the catalogue database through the bot's services (/dev routes:
# ProductService, PricingService, DocumentService, CatalogueService) on 2026-10-31, never from a model answer.
#
# Per turn:
#   message, country (ISO code; omit or null = unknown, which the bot treats as IN)
#   mustContain / mustNotContain: case-insensitive substrings, or "re:<regex>" (case-insensitive)
#   expectedTools: every entry must be called in that turn, in any order; "a|b" accepts either tool;
#                  [] means no tool may be called; omitted means the tool choice is not scored
#   noCurrency:    true = the reply must not contain any currency amount
#   expectedActions: action types that must be among the turn's buttons
#   allowedModes:  llm and/or fallback (default: [llm])

# ---------------------------------------------------------------- lookup by Cat No (4)
- id: catno-ba044
  category: lookup_catno
  turns:
    - message: "Do you have BA044?"
      country: IN
      mustContain: ["BA044", "Salbutamol-D9 acetate", "In Stock"]
      expectedTools: ["searchProducts|getProductDetails"]
      expectedActions: [product]

- id: catno-ba072
  category: lookup_catno
  turns:
