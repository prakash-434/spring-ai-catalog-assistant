# ---------------------------------------------------------------- COA (4)
- id: coa-no-batch
  category: coa
  turns:
    - message: "I need the COA for KL-01-00012"
      country: IN
      mustContain: ["batch"]
      # No batch may be guessed or listed (the real one is KLBF01053).
      mustNotContain: ["KLBF"]
      expectedTools: []

- id: coa-valid-batch
  category: coa
  turns:
    - message: "COA for KL-01-00012 batch KLBF01053"
      country: IN
      mustContain: ["re:available"]
      mustNotContain: ["re:not (be )?available", "re:no (documents|coa)"]
      expectedTools: [checkDocuments]
      expectedActions: [coa]

- id: coa-wrong-batch
  category: coa
  turns:
    - message: "I need the COA for KL-01-00012, batch KLBF99999"
      country: IN
      mustContain: ["re:(not|no|couldn't|could not|unable)"]
      expectedTools: [checkDocuments]

- id: coa-doc-type-missing
  category: coa
  turns:
    - message: "Can I get the HPLC report for KL-01-00012 batch KLBF01053?"
      country: IN
      # Only the COA exists for this batch.
      mustContain: ["HPLC", "re:(not available|isn't available|is not available|no hplc|only)"]
      expectedTools: [checkDocuments]

