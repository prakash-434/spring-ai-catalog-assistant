      country: IN
      mustContain: ["Synthesis on Demand"]
      mustNotContain: ["re:\\bis in stock\\b"]
      expectedTools: ["searchProducts|getProductDetails"]

- id: stock-delivery-2-3-days
  category: stock
  turns:
    - message: "What is the stock status of KL-02-11662?"
      country: IN
      # The label is quoted exactly even though it mentions days; no other delivery promise.
      mustContain: ["In Stock, Delivery in 2-3 Days"]
      mustNotContain: ["re:\\btomorrow\\b", "re:within \\d+ (hours|weeks)"]
      expectedTools: ["searchProducts|getProductDetails"]

- id: stock-in-stock
  category: stock
  turns:
