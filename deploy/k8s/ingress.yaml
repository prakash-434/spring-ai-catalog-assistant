# Routes HTTP traffic on the node to the assistant Service. k3s ships the Traefik ingress controller; on EKS this
# would be the AWS Load Balancer Controller (ingressClassName: alb) instead.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: assistant
  namespace: kaaris
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: assistant
                port:
                  number: 80
